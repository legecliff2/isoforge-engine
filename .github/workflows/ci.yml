name: CI

# Linux jobs run on ubuntu-latest for every event, including push to main, schedule,
# and workflow_dispatch. Nothing in this workflow requests a self-hosted runner.
# Retiring the old box: docs/CI_SELF_HOSTED.md.
#
# Cost policy (macOS minutes bill at 10x Linux):
# - Linux GCC Debug, Linux Clang Release, Windows MSVC Debug: every PR and every push to main
#   (skipped for docs-only changes). Windows minutes bill at 2x Linux.
# - Windows MSVC Release (the slowest job, ~30-46 min x 2): every code push to main, manual
#   dispatch, and PRs carrying the `ci-windows-release` label (add the label, then push a commit
#   or close/reopen the PR; "Re-run jobs" reuses the old event payload and won't see a new label;
#   `labeled` is deliberately not a trigger so unrelated labels don't restart CI). Not on ordinary
#   PRs; Windows Debug still builds and tests every PR. Every main commit is covered by the push
#   run, so it is not added to the nightly schedule.
# - Release jobs skip the python_only ctest label (pure-Python validator tests; the Debug jobs run them).
# - linux-runner does not pick a machine. It only sets Linux compile/test caps, on ubuntu-latest.
#   CI_BURST 'true': Linux test parallelism 8, compile 4. CI_BURST 'false': Linux test
#   parallelism 4, compile 4. It never selects a runner. Every Linux job hard-codes
#   runs-on: ubuntu-latest. In build-test, only the Windows MSVC Debug row is windows-latest.
# - changes and ci-required stay on ubuntu-latest. Windows and macOS stay hosted.
# - Draft PRs skip CI; ci-required passes for them (changes skipped only on drafts).
# - Compiler cache: ccache (Linux/macOS) / sccache (Windows) via actions/cache in cmake-ci.
# - macOS: nightly on main (07:17 UTC, off the hour to avoid GitHub dropping top-of-hour schedules), on manual dispatch, and on PRs whose
#   changes touch platform / render or determinism-sensitive code (see the `mac` filter below).
# - `ci-required` is the single aggregate gate for branch protection: it always runs and
#   succeeds when every needed job passed or was skipped on purpose.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs don't run CI (no ready_for_review = no run until marked ready).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# CI_BURST only changes Linux test parallelism (8 when 'true', 4 when 'false').
# It does not select a runner. Compile parallelism stays 4.
env:
  CI_BURST: 'true'

concurrency:
  # Not a global lock. Several PRs run at once: the group is the PR number, or the ref for a
  # branch that is not a PR. A new push cancels that group only. main (push, schedule, dispatch)
  # gets its own group per sha + event and is never cancelled.
  # Linux is ubuntu-latest for every event, so runs overlap on hosted runners. CI_BURST
  # only changes Linux test parallelism (8 vs 4). It does not choose a runner.
  # Windows is windows-latest and already overlaps Linux.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.sha, github.event_name) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    # Draft PRs: skip everything (ci-required treats this as intended, see below).
    # A pull_request whose head repo is not this repo skips changes, so the jobs below
    # do not run. ci-required fails closed when changes is skipped on a non-draft run.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      # code = anything outside docs/** and Markdown files.
      - id: code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      # mac = platform / render, or determinism-sensitive code whose results must match on every OS.
      - id: mac
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mac:
              - 'engine/platform/**'
              - 'engine/render/**'
              - 'engine/iso2d/**'
              - 'engine/base/**'
              - 'engine/detmath/**'
              - 'engine/procgen/**'
              - 'engine/core/sim/**'
              - 'engine/core/world/**'
              - 'engine/rules/**'
              - 'tests/goldens/**'
              - 'tests/compat/**'
              - '**/golden*'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # Sets hosted Linux compile/test caps. Does not build and does not call the
  # GitHub API. Every Linux job is ubuntu-latest regardless of event or ref.
  # CI_BURST 'true' uses test parallelism 8; 'false' uses 4. Compile stays 4.
  # Drafts never get here. A fork PR that does not edit this file never gets here
  # either (`changes` is skipped, and this job repeats that guard).
  linux-runner:
    name: Linux runner
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    outputs:
      gcc_jobs: ${{ steps.pick.outputs.gcc_jobs }}
      gcc_tests: ${{ steps.pick.outputs.gcc_tests }}
      clang_jobs: ${{ steps.pick.outputs.clang_jobs }}
      clang_tests: ${{ steps.pick.outputs.clang_tests }}
    steps:
      - id: pick
        run: |
          set -euo pipefail
          # Caps only. CI_BURST never selects a runner. 'true' is test parallelism 8.
          # 'false' is test parallelism 4. Compile cap stays 4 either way.
          tests=4
          if [ "${CI_BURST:-}" = "true" ]; then
            tests=8
          fi
          {
            printf 'gcc_jobs=%s\n' 4
            printf 'gcc_tests=%s\n' "$tests"
            printf 'clang_jobs=%s\n' 4
            printf 'clang_tests=%s\n' "$tests"
          } >> "$GITHUB_OUTPUT"
          echo "linux-runner: ubuntu-latest (compile 4 / test ${tests}, CI_BURST=${CI_BURST:-unset})"

  build-test:
    name: ${{ matrix.name }}
    needs: [changes, linux-runner]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'
    # Linux is hard-coded to ubuntu-latest for every event and ref. The Windows
    # row is windows-latest. This expression does not read a job output or a label list.
    runs-on: ${{ matrix.name == 'Windows MSVC Debug' && 'windows-latest' || 'ubuntu-latest' }}
    timeout-minutes: 90
    env:
      # Linux caps come from linux-runner. CI_BURST true: compile 4 / test 8.
      # CI_BURST false: compile 4 / test 4. Windows ignores those outputs and keeps matrix 4 / 4.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ (matrix.name == 'Linux GCC Debug' && needs.linux-runner.outputs.gcc_jobs) || (matrix.name == 'Linux Clang Release' && needs.linux-runner.outputs.clang_jobs) || matrix.jobs }}
      CTEST_PARALLEL_LEVEL: ${{ (matrix.name == 'Linux GCC Debug' && needs.linux-runner.outputs.gcc_tests) || (matrix.name == 'Linux Clang Release' && needs.linux-runner.outputs.clang_tests) || matrix.tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: "Linux GCC Debug",       jobs: 4, tests: 4, preset: ci-linux-gcc,   build: ci-linux-gcc,        test: ci-linux-gcc,        ctest-args: "" }
          - { name: "Linux Clang Release",   jobs: 4, tests: 4, preset: ci-linux-clang, build: ci-linux-clang,      test: ci-linux-clang,      ctest-args: "-LE python_only" }
          - { name: "Windows MSVC Debug",    jobs: 4, tests: 4, preset: ci-win-msvc,    build: ci-win-msvc-debug,   test: ci-win-msvc-debug,   ctest-args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ${{ matrix.preset }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          ctest-args: ${{ matrix.ctest-args }}

  windows-release:
    name: Windows MSVC Release
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' &&
       contains(github.event.pull_request.labels.*.name, 'ci-windows-release'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-win-msvc
          build: ci-win-msvc-release
          test: ci-win-msvc-release
          ctest-args: "-LE python_only"

  # Nightly gate: run the scheduled macOS job only if main moved since the last successful
  # scheduled run (compares head_sha via the Actions API). Dispatch always runs.
  nightly-gate:
    name: Nightly gate
    needs: [linux-runner]
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // ""' || echo "")
          echo "current=$SHA last-successful-nightly=${last:-none}"
          if [ "$last" = "$SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  macos:
    name: macOS AppleClang Debug
    needs: [changes, nightly-gate]
    if: >-
      always() && needs.changes.result == 'success' &&
      ((github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
       github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.mac == 'true'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-mac-clang
          build: ci-mac-clang
          test: ci-mac-clang

  # The one check to mark required. Skipped jobs (docs-only PR, macOS not needed, Windows Release
  # on an unlabelled PR, linux-runner when no Linux job is needed) count as OK; failed or
  # cancelled ones fail the gate. linux-runner skipped on a code push/PR or on schedule fails
  # the gate: that would also skip build-test / nightly-gate and look green.
  # linux-runner only publishes hosted caps. It does not choose a machine.
  ci-required:
    name: ci-required
    needs: [changes, linux-runner, nightly-gate, build-test, windows-release, macos]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.linux-runner.result }} ${{ needs.nightly-gate.result }} ${{ needs.build-test.result }} ${{ needs.windows-release.result }} ${{ needs.macos.result }}
          # 'changes' may only be skipped on purpose for a draft PR.
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES: ${{ needs.changes.result }}
          LINUX_RUNNER: ${{ needs.linux-runner.result }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CHANGES" = skipped ] && [ "$DRAFT" != true ]; then
            echo "::error::changes skipped on a non-draft run"; exit 1
          fi
          if [ "$LINUX_RUNNER" = skipped ] && { [ "$EVENT" = schedule ] || { [ "$CODE" = true ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; }; }; }; then
            echo "::error::linux-runner skipped while a Linux job was required"; exit 1
          fi
          echo "changes linux-runner nightly-gate build-test windows-release macos: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as '$r'"; exit 1 ;;
            esac
          done

  # Nightly macOS failure -> open or update one tracking issue (last green sha vs current sha).
  nightly-report:
    name: Report nightly macOS failure
    needs: macos
    if: always() && github.event_name == 'schedule' && needs.macos.result == 'failure'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="Nightly macOS CI failing on main"
          # Last scheduled run of this workflow on main whose macOS job succeeded.
          last_green=""
          for id in $(gh run list --workflow ci.yml --branch main --event schedule --limit 30 \
                        --json databaseId,headSha -q '.[].databaseId'); do
            ok=$(gh run view "$id" --json jobs -q '[.jobs[] | select(.name == "macOS AppleClang Debug" and .conclusion == "success")] | length')
            if [ "$ok" != "0" ]; then last_green=$(gh run view "$id" --json headSha -q .headSha); break; fi
          done
          if [ -n "$last_green" ]; then
            compare="$SERVER/$GH_REPO/compare/$last_green...$SHA"
            range="Last green: \`$last_green\`. Current: \`$SHA\`. Compare: $compare"
          else
            range="Last green: none in the last 30 nightly runs. Current: \`$SHA\`."
          fi
          body=$(printf 'The nightly **macOS AppleClang Debug** job failed.\n\n%s\n\nRun: %s\n\n_Opened/updated by the nightly-report job in ci.yml._' "$range" "$RUN_URL")
          gh label create ci-nightly --color B60205 --description "Nightly CI failure" 2>/dev/null || true
          num=$(gh issue list --state open --label ci-nightly --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label ci-nightly --body "$body"
          fi
