name: CI

# Cost policy (macOS minutes bill at 10x Linux):
# - Linux GCC Debug, Linux Clang Release, Windows MSVC Debug: every PR and every push to main
#   (skipped for docs-only changes). Windows minutes bill at 2x Linux.
# - Windows MSVC Release (the slowest job, ~30-46 min x 2): every code push to main, manual
#   dispatch, and PRs carrying the `ci-windows-release` label (add the label, then push a commit
#   or close/reopen the PR; "Re-run jobs" reuses the old event payload and won't see a new label;
#   `labeled` is deliberately not a trigger so unrelated labels don't restart CI). Not on ordinary
#   PRs; Windows Debug still builds and tests every PR. Every main commit is covered by the push
#   run, so it is not added to the nightly schedule.
# - Release jobs skip the python_only ctest label (pure-Python validator tests; the Debug jobs run them).
# - Linux GCC Debug, Linux Clang Release, and nightly-gate prefer the self-hosted box
#   ([self-hosted, linux, isoforge]) and otherwise use ubuntu-latest for that same run.
#   One pick per run: Linux is never started on both runners. The box pauses when no agent
#   is active, which used to leave Linux jobs queued until GitHub abandoned them and stalled
#   the merge queue. changes and ci-required stay on ubuntu-latest; Windows/macOS stay hosted.
# - linux-runner (ubuntu-latest) makes the pick. Listing runners requires administration:read,
#   which GITHUB_TOKEN cannot be granted (actions:read is not enough; the API answers 403 with
#   X-Accepted-Github-Permissions: administration=read). The job tries that API anyway and, on
#   403, dispatches linux-runner-canary.yml on the default branch (no checkout, no PR code).
#   If the box accepts the canary, Linux uses the box (compile 4 / test 2). If the canary is
#   still queued when the probe window ends, it is cancelled and Linux uses ubuntu-latest
#   (compile 4 / test 4). A paused box, or one too busy to accept the canary within the
#   window, also falls back, so a run never waits on a runner that is not taking jobs.
#   Dispatch needs actions:write on the linux-runner job only.
# - Draft PRs skip CI; ci-required passes for them (changes skipped only on drafts).
# - Compiler cache: ccache (Linux/macOS) / sccache (Windows) via actions/cache in cmake-ci.
# - macOS: nightly on main (07:17 UTC, off the hour to avoid GitHub dropping top-of-hour schedules), on manual dispatch, and on PRs whose
#   changes touch platform / render or determinism-sensitive code (see the `mac` filter below).
# - `ci-required` is the single aggregate gate for branch protection: it always runs and
#   succeeds when every needed job passed or was skipped on purpose.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs don't run CI (no ready_for_review = no run until marked ready).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Branches/PRs: a new push cancels the previous run. main (push, schedule, dispatch): every run
  # gets its own group (keyed by sha + event) and is never cancelled.
  # PRs are keyed by PR number so all pushes to one PR share a group.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.sha, github.event_name) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    # Draft PRs: skip everything (ci-required treats this as intended, see below).
    # Fork PRs never reach the self-hosted runner: changes is skipped, so linux-runner is
    # skipped (no canary is dispatched) and ci-required fails closed.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      # code = anything outside docs/** and Markdown files.
      - id: code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      # mac = platform / render, or determinism-sensitive code whose results must match on every OS.
      - id: mac
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mac:
              - 'engine/platform/**'
              - 'engine/render/**'
              - 'engine/iso2d/**'
              - 'engine/base/**'
              - 'engine/detmath/**'
              - 'engine/procgen/**'
              - 'engine/core/sim/**'
              - 'engine/core/world/**'
              - 'engine/rules/**'
              - 'tests/goldens/**'
              - 'tests/compat/**'
              - '**/golden*'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # One Linux runs-on for this workflow run. Does not build. Forks and drafts never get here:
  # `changes` is skipped, and this job needs it (and repeats the same guard in `if`).
  linux-runner:
    name: Linux runner
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      hosted: ${{ steps.pick.outputs.hosted }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          # Defaults: ~75s covers one missed runner pickup (GitHub requeues after 60s).
          # Override only in local tests of this script.
          PROBE_SECONDS="${PROBE_SECONDS:-75}"
          SLEEP_SECONDS="${SLEEP_SECONDS:-5}"
          cid="ci-${GITHUB_RUN_ID}"
          title="linux-runner-canary ${cid}"
          tmp=$(mktemp -d)
          canary_id=""
          trap 'rm -rf "$tmp"' EXIT

          use_box() {
            printf 'runs_on=%s\n' '["self-hosted","linux","isoforge"]' >> "$GITHUB_OUTPUT"
            printf 'hosted=%s\n' false >> "$GITHUB_OUTPUT"
            echo "linux-runner: box ($1)"
            exit 0
          }
          use_hosted() {
            if [ -n "$canary_id" ]; then
              timeout 20 gh api --method POST "repos/${REPO}/actions/runs/${canary_id}/cancel" >/dev/null 2>&1 || true
            fi
            printf 'runs_on=%s\n' '"ubuntu-latest"' >> "$GITHUB_OUTPUT"
            printf 'hosted=%s\n' true >> "$GITHUB_OUTPUT"
            if [ "${2:-}" = warn ]; then echo "::warning::linux-runner: ubuntu-latest ($1)"; fi
            echo "linux-runner: ubuntu-latest ($1)"
            exit 0
          }
          brief() { tr '\n' ' ' <"$1" | head -c 180 || true; }

          # Authoritative when the token can read runners. Workflow tokens cannot hold
          # administration:read; a 403 falls through to the canary. A 200 that shows the
          # box online (including busy) skips the canary so we still prefer the box.
          if timeout 20 gh api "repos/${REPO}/actions/runners?per_page=100" >"$tmp/runners.json" 2>"$tmp/runners.err"; then
            jq -c '.runners[]? | {name,status,busy,labels:[.labels[].name]}' "$tmp/runners.json" || true
            # index() is 0 for the first label, and jq treats 0 as false, so compare to null.
            if online=$(jq '[.runners[]? | select(.status=="online") | select(
                ([.labels[]?.name] | map(ascii_downcase)) as $n
                | ["self-hosted","linux","isoforge"] | all(.[]; . as $l | $n | index($l) != null)
              )] | length' "$tmp/runners.json"); then
              if [ "${online:-0}" -gt 0 ]; then
                use_box "runners API: ${online} online with self-hosted, linux, isoforge"
              fi
              total=$(jq '.total_count // 0' "$tmp/runners.json")
              shown=$(jq '(.runners // []) | length' "$tmp/runners.json")
              if [ "$total" -le "$shown" ]; then
                use_hosted "runners API: no online runner with self-hosted, linux, isoforge"
              fi
              echo "runners API page truncated (${shown}/${total}); probing with a canary"
            else
              echo "runners API returned JSON the probe could not read; probing with a canary"
            fi
          else
            echo "runners list API not permitted ($(brief "$tmp/runners.err")); probing with a canary"
          fi

          payload=$(jq -n --arg ref "$DEFAULT_BRANCH" --arg cid "$cid" '{ref:$ref, inputs:{cid:$cid}}')
          if ! timeout 20 gh api --method POST "repos/${REPO}/actions/workflows/linux-runner-canary.yml/dispatches" --input - <<<"$payload" >"$tmp/dispatch.out" 2>"$tmp/dispatch.err"; then
            use_hosted "canary dispatch failed ($(brief "$tmp/dispatch.err"))" warn
          fi

          deadline=$((SECONDS + PROBE_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if runs_json=$(timeout 20 gh api "repos/${REPO}/actions/workflows/linux-runner-canary.yml/runs?event=workflow_dispatch&per_page=30" 2>"$tmp/list.err"); then
              found=$(jq -r --arg t "$title" '[.workflow_runs[]? | select(.display_title==$t or .name==$t) | .id] | first // empty' <<<"$runs_json")
              if [ -n "$found" ] && [ "$found" != "null" ]; then
                canary_id=$found
                if jobs_json=$(timeout 20 gh api "repos/${REPO}/actions/runs/${canary_id}/jobs" 2>"$tmp/jobs.err"); then
                  started=$(jq '[.jobs[]? | select(.started_at != null)] | length' <<<"$jobs_json")
                  if [ "${started:-0}" -gt 0 ]; then
                    use_box "canary ${canary_id} accepted by the box"
                  fi
                fi
              fi
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ -n "$canary_id" ]; then
            use_hosted "canary ${canary_id} not accepted within ${PROBE_SECONDS}s"
          fi
          use_hosted "dispatched canary never appeared in the runs list within ${PROBE_SECONDS}s" warn

  build-test:
    name: ${{ matrix.name }}
    needs: [changes, linux-runner]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'
    # Linux rows use linux-runner's pick. Windows rows stay on matrix.os.
    # fromJSON stays outside &&/|| so both branches are JSON text, not mixed types.
    runs-on: ${{ fromJSON(startsWith(matrix.name, 'Linux') && (needs.linux-runner.outputs.runs_on || '"ubuntu-latest"') || matrix.os) }}
    env:
      # Box is shared (CPUQuota 400%, MemoryMax 8G): compile 4 / test 2.
      # Hosted fallback is 4-vCPU ubuntu-latest: same compile cap, test 4 (same as Windows Debug).
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ matrix.jobs }}
      CTEST_PARALLEL_LEVEL: ${{ startsWith(matrix.name, 'Linux') && needs.linux-runner.outputs.hosted == 'true' && 4 || matrix.tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux `os` is the preferred box labels (the actual runs-on comes from linux-runner).
          - { name: "Linux GCC Debug",       os: '["self-hosted","linux","isoforge"]', jobs: 4, tests: 2, preset: ci-linux-gcc,   build: ci-linux-gcc,        test: ci-linux-gcc,        ctest-args: "" }
          - { name: "Linux Clang Release",   os: '["self-hosted","linux","isoforge"]', jobs: 4, tests: 2, preset: ci-linux-clang, build: ci-linux-clang,      test: ci-linux-clang,      ctest-args: "-LE python_only" }
          - { name: "Windows MSVC Debug",    os: '"windows-latest"', jobs: 4, tests: 4, preset: ci-win-msvc,    build: ci-win-msvc-debug,   test: ci-win-msvc-debug,   ctest-args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ${{ matrix.preset }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          ctest-args: ${{ matrix.ctest-args }}

  windows-release:
    name: Windows MSVC Release
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' &&
       contains(github.event.pull_request.labels.*.name, 'ci-windows-release'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-win-msvc
          build: ci-win-msvc-release
          test: ci-win-msvc-release
          ctest-args: "-LE python_only"

  # Nightly gate: run the scheduled macOS job only if main moved since the last successful
  # scheduled run (compares head_sha via the Actions API). Dispatch always runs.
  nightly-gate:
    name: Nightly gate
    needs: [linux-runner]
    if: github.event_name == 'schedule'
    runs-on: ${{ fromJSON(needs.linux-runner.outputs.runs_on || '"ubuntu-latest"') }}
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // ""' || echo "")
          echo "current=$SHA last-successful-nightly=${last:-none}"
          if [ "$last" = "$SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  macos:
    name: macOS AppleClang Debug
    needs: [changes, nightly-gate]
    if: >-
      always() && needs.changes.result == 'success' &&
      ((github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
       github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.mac == 'true'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-mac-clang
          build: ci-mac-clang
          test: ci-mac-clang

  # The one check to mark required. Skipped jobs (docs-only PR, macOS not needed, Windows Release
  # on an unlabelled PR, linux-runner when no Linux job is needed) count as OK; failed or
  # cancelled ones fail the gate. linux-runner skipped on a code push/PR or on schedule fails
  # the gate: that would also skip build-test / nightly-gate and look green.
  ci-required:
    name: ci-required
    needs: [changes, linux-runner, nightly-gate, build-test, windows-release, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.linux-runner.result }} ${{ needs.nightly-gate.result }} ${{ needs.build-test.result }} ${{ needs.windows-release.result }} ${{ needs.macos.result }}
          # 'changes' may only be skipped on purpose for a draft PR.
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES: ${{ needs.changes.result }}
          LINUX_RUNNER: ${{ needs.linux-runner.result }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CHANGES" = skipped ] && [ "$DRAFT" != true ]; then
            echo "::error::changes skipped on a non-draft run"; exit 1
          fi
          if [ "$LINUX_RUNNER" = skipped ] && { [ "$EVENT" = schedule ] || { [ "$CODE" = true ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; }; }; }; then
            echo "::error::linux-runner skipped while a Linux job was required"; exit 1
          fi
          echo "changes linux-runner nightly-gate build-test windows-release macos: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as '$r'"; exit 1 ;;
            esac
          done

  # Nightly macOS failure -> open or update one tracking issue (last green sha vs current sha).
  nightly-report:
    name: Report nightly macOS failure
    needs: macos
    if: always() && github.event_name == 'schedule' && needs.macos.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="Nightly macOS CI failing on main"
          # Last scheduled run of this workflow on main whose macOS job succeeded.
          last_green=""
          for id in $(gh run list --workflow ci.yml --branch main --event schedule --limit 30 \
                        --json databaseId,headSha -q '.[].databaseId'); do
            ok=$(gh run view "$id" --json jobs -q '[.jobs[] | select(.name == "macOS AppleClang Debug" and .conclusion == "success")] | length')
            if [ "$ok" != "0" ]; then last_green=$(gh run view "$id" --json headSha -q .headSha); break; fi
          done
          if [ -n "$last_green" ]; then
            compare="$SERVER/$GH_REPO/compare/$last_green...$SHA"
            range="Last green: \`$last_green\`. Current: \`$SHA\`. Compare: $compare"
          else
            range="Last green: none in the last 30 nightly runs. Current: \`$SHA\`."
          fi
          body=$(printf 'The nightly **macOS AppleClang Debug** job failed.\n\n%s\n\nRun: %s\n\n_Opened/updated by the nightly-report job in ci.yml._' "$range" "$RUN_URL")
          gh label create ci-nightly --color B60205 --description "Nightly CI failure" 2>/dev/null || true
          num=$(gh issue list --state open --label ci-nightly --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label ci-nightly --body "$body"
          fi
