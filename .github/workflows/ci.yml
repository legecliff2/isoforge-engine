name: CI

# Public-repo rules for the self-hosted box, and the GitHub settings that enforce
# them (a workflow file cannot): docs/CI_SELF_HOSTED.md
#
# Cost policy (macOS minutes bill at 10x Linux):
# - Linux GCC Debug, Linux Clang Release, Windows MSVC Debug: every PR and every push to main
#   (skipped for docs-only changes). Windows minutes bill at 2x Linux.
# - Windows MSVC Release (the slowest job, ~30-46 min x 2): every code push to main, manual
#   dispatch, and PRs carrying the `ci-windows-release` label (add the label, then push a commit
#   or close/reopen the PR; "Re-run jobs" reuses the old event payload and won't see a new label;
#   `labeled` is deliberately not a trigger so unrelated labels don't restart CI). Not on ordinary
#   PRs; Windows Debug still builds and tests every PR. Every main commit is covered by the push
#   run, so it is not added to the nightly schedule.
# - Release jobs skip the python_only ctest label (pure-Python validator tests; the Debug jobs run them).
# - Linux runner pick is one switch, CI_BURST (top-level env below). linux-runner reads it.
#   The box ([self-hosted, linux, isoforge]) is eligible only when github.ref is
#   refs/heads/main and the event is push, schedule, or workflow_dispatch. Every
#   pull_request Linux job (GCC Debug, Clang Release, and any other Linux row) runs
#   on ubuntu-latest. pull_request_target and every other event do too. The runs-on
#   expression forces that; it does not trust the picker. A fork PR that edits this
#   file is not stopped by the expression: GitHub runs the workflow from the PR.
#   The runner-group pin in docs/CI_SELF_HOSTED.md is what stops that job reaching the box.
#   CI_BURST 'false' (pre-burst / #281, trusted events only): Linux GCC Debug, Linux
#   Clang Release, and nightly-gate share one pick. Prefer the box; use ubuntu-latest
#   for that same run only when the box does not accept the canary. PRs stay on
#   ubuntu-latest and do not dispatch a canary. One pick per trusted run: those jobs
#   are never started on both runners. Box caps compile 4 / test 2. Hosted fallback
#   and PR hosted caps: compile 4 / test 4.
#   CI_BURST 'true' (temporary hosted capacity, until the revert in #299): every PR's
#   Linux jobs run on ubuntu-latest with no canary, so several PRs run Linux at once,
#   in parallel with Windows on windows-latest. The box is not a queue. A push to main
#   may still put Linux GCC Debug on the box when its canary is the earliest probe in
#   the window and the box accepts it; Linux Clang Release of that run stays on
#   ubuntu-latest. Schedule (nightly-gate) stays on ubuntu-latest during the burst.
#   Every other run keeps Linux on ubuntu-latest. A busy, paused, or slow box does not
#   block the run. Hosted burst caps: compile 4 / test 8. Box caps stay 4 / 2.
#   Setting CI_BURST back to 'false' restores the #281 canary for main push, schedule,
#   and main dispatch. It does not put pull_request jobs back on the box.
# - The box pauses when no agent is active, which used to leave Linux jobs queued until GitHub
#   abandoned them and stalled the merge queue. changes and ci-required stay on ubuntu-latest;
#   Windows/macOS stay hosted. Pull-request Linux is ubuntu-latest for that reason and because
#   untrusted code must not run on the box (docs/CI_SELF_HOSTED.md).
# - linux-runner (ubuntu-latest) makes the pick. Listing runners requires administration:read,
#   which GITHUB_TOKEN cannot be granted (actions:read is not enough; the API answers 403 with
#   X-Accepted-Github-Permissions: administration=read). On a trusted event the job tries that
#   API anyway and, on 403, dispatches linux-runner-canary.yml on the default branch (no
#   checkout, no PR code). A pull_request run does not dispatch it. Dispatch needs actions:write
#   on the linux-runner job only. With CI_BURST 'false', if the box accepts the canary, Linux
#   uses the box; if the canary is still queued when the probe window ends (~75s), it is
#   cancelled and Linux uses ubuntu-latest. With CI_BURST 'true', the probe window is ~20s and
#   only the earliest accepted canary claims the box (GCC on a main push); other probes are
#   cancelled and that run uses ubuntu-latest. Burst probes pass isolate=true so they do not
#   share the canary's one-at-a-time group (that group only protects the box). If the default
#   branch's canary has no isolate input yet, the dispatch is retried without it.
# - Draft PRs skip CI; ci-required passes for them (changes skipped only on drafts).
# - Compiler cache: ccache (Linux/macOS) / sccache (Windows) via actions/cache in cmake-ci.
# - macOS: nightly on main (07:17 UTC, off the hour to avoid GitHub dropping top-of-hour schedules), on manual dispatch, and on PRs whose
#   changes touch platform / render or determinism-sensitive code (see the `mac` filter below).
# - `ci-required` is the single aggregate gate for branch protection: it always runs and
#   succeeds when every needed job passed or was skipped on purpose.
on:
  push:
    branches: [main]
  pull_request:
    # Draft PRs don't run CI (no ready_for_review = no run until marked ready).
    types: [opened, synchronize, reopened, ready_for_review]
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

# One-line burst switch. 'true' = PRs hosted, and a main push may still claim the box
# for one GCC job (see header). 'false' = main push, schedule, and main dispatch
# prefer the box, ubuntu-latest only when the box misses the canary (#281).
# Pull requests stay on ubuntu-latest either way.
env:
  CI_BURST: 'true'

concurrency:
  # Not a global lock. Several PRs run at once: the group is the PR number, or the ref for a
  # branch that is not a PR. A new push cancels that group only. main (push, schedule, dispatch)
  # gets its own group per sha + event and is never cancelled.
  # Linux used to serialize anyway because every run preferred the one box. Pull
  # requests stay on ubuntu-latest. A push to main may still place one GCC job on
  # the box when CI_BURST is true and the box is free, or whenever CI_BURST is false
  # and the canary is accepted.
  # Windows is windows-latest and is not in any box queue, so it already overlaps Linux.
  group: ${{ github.workflow }}-${{ github.ref == 'refs/heads/main' && format('{0}-{1}', github.sha, github.event_name) || (github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number)) || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  changes:
    name: Detect changes
    # Draft PRs: skip everything (ci-required treats this as intended, see below).
    # A pull_request whose head repo is not this repo skips changes, so the jobs below
    # do not run and no canary is dispatched. A fork that edits this file removes that
    # guard. pull_request runs-on below is still ubuntu-latest, and a replaced workflow
    # is kept off the box by the runner group in docs/CI_SELF_HOSTED.md. ci-required
    # fails closed when changes is skipped on a non-draft run.
    if: github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      code: ${{ steps.code.outputs.code }}
      mac: ${{ steps.mac.outputs.mac }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name != 'pull_request'
      # code = anything outside docs/** and Markdown files.
      - id: code
        if: github.event_name == 'pull_request' || github.event_name == 'push'
        uses: dorny/paths-filter@v3
        with:
          predicate-quantifier: every
          filters: |
            code:
              - '**'
              - '!docs/**'
              - '!**/*.md'
      # mac = platform / render, or determinism-sensitive code whose results must match on every OS.
      - id: mac
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            mac:
              - 'engine/platform/**'
              - 'engine/render/**'
              - 'engine/iso2d/**'
              - 'engine/base/**'
              - 'engine/detmath/**'
              - 'engine/procgen/**'
              - 'engine/core/sim/**'
              - 'engine/core/world/**'
              - 'engine/rules/**'
              - 'tests/goldens/**'
              - 'tests/compat/**'
              - '**/golden*'
              - 'CMakeLists.txt'
              - 'CMakePresets.json'
              - 'cmake/**'
              - '.github/workflows/ci.yml'
              - '.github/actions/**'

  # Picks Linux runs-on for this workflow run. Does not build. Runs on ubuntu-latest.
  # Pull requests still run this job so hosted compile/test caps are set. The script
  # returns ubuntu-latest before any runner API call or canary dispatch unless the
  # event is push, schedule, or workflow_dispatch and github.ref is refs/heads/main.
  # Drafts never get here. A fork PR that does not edit this file never gets here
  # either (`changes` is skipped, and this job repeats that guard). A fork that edits
  # this file is outside this guard (docs/CI_SELF_HOSTED.md).
  # CI_BURST false, trusted events: one pick for every Linux job and the nightly gate.
  # CI_BURST true, push to main: per-job outputs. Hosted unless this run wins the box
  # claim (GCC only). Schedule during the burst stays hosted.
  linux-runner:
    name: Linux runner
    needs: changes
    if: >-
      (github.event_name != 'pull_request' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)) &&
      (github.event_name == 'schedule' || ((github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
      contents: read
    outputs:
      runs_on: ${{ steps.pick.outputs.runs_on }}
      hosted: ${{ steps.pick.outputs.hosted }}
      gcc_runs_on: ${{ steps.pick.outputs.gcc_runs_on }}
      clang_runs_on: ${{ steps.pick.outputs.clang_runs_on }}
      nightly_runs_on: ${{ steps.pick.outputs.nightly_runs_on }}
      gcc_jobs: ${{ steps.pick.outputs.gcc_jobs }}
      gcc_tests: ${{ steps.pick.outputs.gcc_tests }}
      clang_jobs: ${{ steps.pick.outputs.clang_jobs }}
      clang_tests: ${{ steps.pick.outputs.clang_tests }}
    steps:
      - id: pick
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Defaults: ~75s covers one missed runner pickup (GitHub requeues after 60s).
          # Override only in local tests of this script. Burst uses a shorter claim window.
          PROBE_SECONDS="${PROBE_SECONDS:-75}"
          SLEEP_SECONDS="${SLEEP_SECONDS:-5}"
          BURST_PROBE_SECONDS="${BURST_PROBE_SECONDS:-20}"
          BURST_SLEEP_SECONDS="${BURST_SLEEP_SECONDS:-2}"
          BURST_CONFIRM_SECONDS="${BURST_CONFIRM_SECONDS:-3}"
          # Box caps stay 4/2. Hosted fallback (CI_BURST false) stays compile 4 / test 4.
          # CI_BURST hosted uses compile 4 (4 vCPU, debug compiles are memory-heavy) / test 8.
          HOSTED_JOBS=4
          HOSTED_TESTS=4
          cid="ci-${GITHUB_RUN_ID}"
          title="linux-runner-canary ${cid}"
          tmp=$(mktemp -d)
          canary_id=""
          trap 'rm -rf "$tmp"' EXIT

          write_uniform() {
            # $1 runs_on JSON, $2 hosted, $3 jobs, $4 tests. Same runner for every Linux job.
            {
              printf 'runs_on=%s\n' "$1"
              printf 'hosted=%s\n' "$2"
              printf 'gcc_runs_on=%s\n' "$1"
              printf 'clang_runs_on=%s\n' "$1"
              printf 'nightly_runs_on=%s\n' "$1"
              printf 'gcc_jobs=%s\n' "$3"
              printf 'gcc_tests=%s\n' "$4"
              printf 'clang_jobs=%s\n' "$3"
              printf 'clang_tests=%s\n' "$4"
            } >> "$GITHUB_OUTPUT"
          }
          use_box() {
            write_uniform '["self-hosted","linux","isoforge"]' false 4 2
            echo "linux-runner: box ($1)"
            exit 0
          }
          use_hosted() {
            if [ -n "$canary_id" ]; then
              timeout 20 gh api --method POST "repos/${REPO}/actions/runs/${canary_id}/cancel" >/dev/null 2>&1 || true
            fi
            write_uniform '"ubuntu-latest"' true "$HOSTED_JOBS" "$HOSTED_TESTS"
            if [ "${2:-}" = warn ]; then echo "::warning::linux-runner: ubuntu-latest ($1)"; fi
            echo "linux-runner: ubuntu-latest ($1)"
            exit 0
          }
          # Burst only: GCC on the box (4/2), Clang and nightly on hosted.
          claim_box() {
            {
              printf 'runs_on=%s\n' '["self-hosted","linux","isoforge"]'
              printf 'hosted=%s\n' false
              printf 'gcc_runs_on=%s\n' '["self-hosted","linux","isoforge"]'
              printf 'clang_runs_on=%s\n' '"ubuntu-latest"'
              printf 'nightly_runs_on=%s\n' '"ubuntu-latest"'
              printf 'gcc_jobs=%s\n' 4
              printf 'gcc_tests=%s\n' 2
              printf 'clang_jobs=%s\n' "$HOSTED_JOBS"
              printf 'clang_tests=%s\n' "$HOSTED_TESTS"
            } >> "$GITHUB_OUTPUT"
            echo "linux-runner: burst gcc=box (4/2) clang=ubuntu-latest (${HOSTED_JOBS}/${HOSTED_TESTS}) ($1)"
            exit 0
          }
          brief() { tr '\n' ' ' <"$1" | head -c 180 || true; }

          # Lower non-cancelled canary ids in the recent window. 0 means we are the earliest.
          lower_probes() {
            jq -r --argjson id "$canary_id" --arg cutoff "$cutoff" '
              [.workflow_runs[]?
                | select((.display_title // .name // "") | startswith("linux-runner-canary"))
                | select((.created_at // "") >= $cutoff)
                | select((.conclusion // "") as $c | $c != "cancelled" and $c != "failure" and $c != "timed_out")
                | select(.id < $id)
              ] | length' <<<"$1"
          }

          burst_main() {
            # Nightly gate is a short API call. Do not spend the box claim on it.
            if [ "${EVENT_NAME:-}" = "schedule" ]; then
              use_hosted "burst schedule: nightly gate on ubuntu-latest"
            fi

            # Runners API when the token can read it (it usually cannot). Busy or offline:
            # hosted immediately, no canary. Idle: still claim with a canary so one run
            # lands on the box instead of every idle observation doing so.
            if timeout 20 gh api "repos/${REPO}/actions/runners?per_page=100" >"$tmp/runners.json" 2>"$tmp/runners.err"; then
              jq -c '.runners[]? | {name,status,busy,labels:[.labels[].name]}' "$tmp/runners.json" || true
              if online=$(jq '[.runners[]? | select(.status=="online") | select(
                  ([.labels[]?.name] | map(ascii_downcase)) as $n
                  | ["self-hosted","linux","isoforge"] | all(.[]; . as $l | $n | index($l) != null)
                )] | length' "$tmp/runners.json"); then
                idle=$(jq '[.runners[]? | select(.status=="online" and .busy==false) | select(
                    ([.labels[]?.name] | map(ascii_downcase)) as $n
                    | ["self-hosted","linux","isoforge"] | all(.[]; . as $l | $n | index($l) != null)
                  )] | length' "$tmp/runners.json" || echo "")
                if [ -z "${idle}" ]; then
                  echo "burst: could not count idle runners; probing with a canary"
                elif [ "${online:-0}" -eq 0 ]; then
                  total=$(jq '.total_count // 0' "$tmp/runners.json")
                  shown=$(jq '(.runners // []) | length' "$tmp/runners.json")
                  if [ "$total" -le "$shown" ]; then
                    use_hosted "burst: runners API: no online runner with self-hosted, linux, isoforge"
                  fi
                  echo "burst: runners API page truncated (${shown}/${total}); probing with a canary"
                elif [ "${idle:-0}" -eq 0 ]; then
                  use_hosted "burst: runners API: box online but busy"
                else
                  echo "burst: runners API: box idle; claiming with a canary so only one run uses it"
                fi
              else
                echo "burst: runners API returned JSON the probe could not read; probing with a canary"
              fi
            else
              echo "burst: runners list API not permitted ($(brief "$tmp/runners.err")); probing with a canary"
            fi

            # isolate=true loosens the canary's one-at-a-time group. The default-branch
            # canary rejects unknown inputs until this lands, so retry without it.
            payload=$(jq -n --arg ref "$DEFAULT_BRANCH" --arg cid "$cid" '{ref:$ref, inputs:{cid:$cid, isolate:"true"}}')
            if ! timeout 20 gh api --method POST "repos/${REPO}/actions/workflows/linux-runner-canary.yml/dispatches" --input - <<<"$payload" >"$tmp/dispatch.out" 2>"$tmp/dispatch.err"; then
              echo "burst: isolate dispatch failed ($(brief "$tmp/dispatch.err")); retrying without isolate"
              payload=$(jq -n --arg ref "$DEFAULT_BRANCH" --arg cid "$cid" '{ref:$ref, inputs:{cid:$cid}}')
              if ! timeout 20 gh api --method POST "repos/${REPO}/actions/workflows/linux-runner-canary.yml/dispatches" --input - <<<"$payload" >"$tmp/dispatch.out" 2>"$tmp/dispatch.err"; then
                use_hosted "burst: canary dispatch failed ($(brief "$tmp/dispatch.err"))" warn
              fi
            fi

            # Recent probes only. A completed canary ages out quickly so a later run can
            # claim the box again after the previous GCC job has had time to start.
            cutoff=$(date -u -d '60 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
            deadline=$((SECONDS + BURST_PROBE_SECONDS))
            while [ "$SECONDS" -lt "$deadline" ]; do
              if runs_json=$(timeout 20 gh api "repos/${REPO}/actions/workflows/linux-runner-canary.yml/runs?event=workflow_dispatch&per_page=30" 2>"$tmp/list.err"); then
                found=$(jq -r --arg t "$title" '[.workflow_runs[]? | select(.display_title==$t or .name==$t) | .id] | first // empty' <<<"$runs_json")
                if [ -n "$found" ] && [ "$found" != "null" ]; then
                  canary_id=$found
                  conclusion=$(jq -r --arg t "$title" '[.workflow_runs[]? | select(.display_title==$t or .name==$t) | .conclusion // ""] | first // ""' <<<"$runs_json")
                  if [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "failure" ] || [ "$conclusion" = "timed_out" ]; then
                    use_hosted "burst: canary ${canary_id} ${conclusion}"
                  fi
                  lower=$(lower_probes "$runs_json" || echo 1)
                  if [ "${lower:-1}" -gt 0 ]; then
                    use_hosted "burst: canary ${canary_id} lost the claim to an earlier probe"
                  fi
                  if jobs_json=$(timeout 20 gh api "repos/${REPO}/actions/runs/${canary_id}/jobs" 2>"$tmp/jobs.err"); then
                    started=$(jq '[.jobs[]? | select(.started_at != null)] | length' <<<"$jobs_json")
                    if [ "${started:-0}" -gt 0 ]; then
                      if [ "$BURST_CONFIRM_SECONDS" -gt 0 ]; then sleep "$BURST_CONFIRM_SECONDS"; fi
                      if ! runs_json=$(timeout 20 gh api "repos/${REPO}/actions/workflows/linux-runner-canary.yml/runs?event=workflow_dispatch&per_page=30" 2>"$tmp/list.err"); then
                        use_hosted "burst: could not recheck canaries before claim" warn
                      fi
                      conclusion=$(jq -r --arg t "$title" '[.workflow_runs[]? | select(.display_title==$t or .name==$t) | .conclusion // ""] | first // ""' <<<"$runs_json")
                      if [ "$conclusion" = "cancelled" ] || [ "$conclusion" = "failure" ] || [ "$conclusion" = "timed_out" ]; then
                        use_hosted "burst: canary ${canary_id} ${conclusion} before claim"
                      fi
                      lower=$(lower_probes "$runs_json" || echo 1)
                      if [ "${lower:-1}" -gt 0 ]; then
                        use_hosted "burst: canary ${canary_id} lost the claim to an earlier probe"
                      fi
                      claim_box "burst: canary ${canary_id} accepted and is the earliest probe"
                    fi
                  fi
                fi
              fi
              sleep "$BURST_SLEEP_SECONDS"
            done
            if [ -n "$canary_id" ]; then
              use_hosted "burst: canary ${canary_id} not accepted within ${BURST_PROBE_SECONDS}s"
            fi
            use_hosted "burst: dispatched canary never appeared in the runs list within ${BURST_PROBE_SECONDS}s" warn
          }

          # Box only for push, schedule, and workflow_dispatch of refs/heads/main.
          # pull_request, pull_request_target, and every other event return hosted
          # here, before any runner API call or canary dispatch. Caps still follow
          # CI_BURST (hosted test 8 vs 4).
          if [ "${CI_BURST:-}" = "true" ]; then
            HOSTED_TESTS=8
          fi
          box_ok=false
          case "${EVENT_NAME:-}" in
            push|schedule|workflow_dispatch)
              if [ "${REF:-}" = "refs/heads/main" ]; then
                box_ok=true
              fi
              ;;
          esac
          if [ "$box_ok" != true ]; then
            use_hosted "event ${EVENT_NAME:-none} ref ${REF:-none}: not a main push, schedule, or main dispatch"
          fi
          if [ "${CI_BURST:-}" = "true" ]; then
            burst_main
          fi

          # Authoritative when the token can read runners. Workflow tokens cannot hold
          # administration:read; a 403 falls through to the canary. A 200 that shows the
          # box online (including busy) skips the canary so we still prefer the box.
          if timeout 20 gh api "repos/${REPO}/actions/runners?per_page=100" >"$tmp/runners.json" 2>"$tmp/runners.err"; then
            jq -c '.runners[]? | {name,status,busy,labels:[.labels[].name]}' "$tmp/runners.json" || true
            # index() is 0 for the first label, and jq treats 0 as false, so compare to null.
            if online=$(jq '[.runners[]? | select(.status=="online") | select(
                ([.labels[]?.name] | map(ascii_downcase)) as $n
                | ["self-hosted","linux","isoforge"] | all(.[]; . as $l | $n | index($l) != null)
              )] | length' "$tmp/runners.json"); then
              if [ "${online:-0}" -gt 0 ]; then
                use_box "runners API: ${online} online with self-hosted, linux, isoforge"
              fi
              total=$(jq '.total_count // 0' "$tmp/runners.json")
              shown=$(jq '(.runners // []) | length' "$tmp/runners.json")
              if [ "$total" -le "$shown" ]; then
                use_hosted "runners API: no online runner with self-hosted, linux, isoforge"
              fi
              echo "runners API page truncated (${shown}/${total}); probing with a canary"
            else
              echo "runners API returned JSON the probe could not read; probing with a canary"
            fi
          else
            echo "runners list API not permitted ($(brief "$tmp/runners.err")); probing with a canary"
          fi

          payload=$(jq -n --arg ref "$DEFAULT_BRANCH" --arg cid "$cid" '{ref:$ref, inputs:{cid:$cid}}')
          if ! timeout 20 gh api --method POST "repos/${REPO}/actions/workflows/linux-runner-canary.yml/dispatches" --input - <<<"$payload" >"$tmp/dispatch.out" 2>"$tmp/dispatch.err"; then
            use_hosted "canary dispatch failed ($(brief "$tmp/dispatch.err"))" warn
          fi

          deadline=$((SECONDS + PROBE_SECONDS))
          while [ "$SECONDS" -lt "$deadline" ]; do
            if runs_json=$(timeout 20 gh api "repos/${REPO}/actions/workflows/linux-runner-canary.yml/runs?event=workflow_dispatch&per_page=30" 2>"$tmp/list.err"); then
              found=$(jq -r --arg t "$title" '[.workflow_runs[]? | select(.display_title==$t or .name==$t) | .id] | first // empty' <<<"$runs_json")
              if [ -n "$found" ] && [ "$found" != "null" ]; then
                canary_id=$found
                if jobs_json=$(timeout 20 gh api "repos/${REPO}/actions/runs/${canary_id}/jobs" 2>"$tmp/jobs.err"); then
                  started=$(jq '[.jobs[]? | select(.started_at != null)] | length' <<<"$jobs_json")
                  if [ "${started:-0}" -gt 0 ]; then
                    use_box "canary ${canary_id} accepted by the box"
                  fi
                fi
              fi
            fi
            sleep "$SLEEP_SECONDS"
          done
          if [ -n "$canary_id" ]; then
            use_hosted "canary ${canary_id} not accepted within ${PROBE_SECONDS}s"
          fi
          use_hosted "dispatched canary never appeared in the runs list within ${PROBE_SECONDS}s" warn

  build-test:
    name: ${{ matrix.name }}
    needs: [changes, linux-runner]
    if: (github.event_name == 'push' || github.event_name == 'pull_request') && needs.changes.outputs.code == 'true'
    # Linux rows: the box is eligible only when github.ref is refs/heads/main and the
    # event is push, schedule, or workflow_dispatch. pull_request, pull_request_target,
    # and every other event are ubuntu-latest even if linux-runner outputs the box.
    # Trusted events use the per-job pick. Empty outputs fall back to ubuntu-latest,
    # never to the box. Windows rows stay on matrix.os (the guard is inside the Linux
    # name checks, so a pull_request does not move Windows onto ubuntu-latest).
    # fromJSON stays outside &&/|| so every branch is JSON text, not a bool mixed with text.
    runs-on: ${{ fromJSON((matrix.name == 'Linux GCC Debug' && ((!(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && '"ubuntu-latest"') || needs.linux-runner.outputs.gcc_runs_on)) || (matrix.name == 'Linux Clang Release' && ((!(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && '"ubuntu-latest"') || needs.linux-runner.outputs.clang_runs_on)) || (startsWith(matrix.name, 'Linux') && '"ubuntu-latest"') || matrix.os) }}
    env:
      # Numbers come from linux-runner. Box: compile 4 / test 2.
      # Hosted, CI_BURST false: compile 4 / test 4. Hosted, CI_BURST true: compile 4 / test 8.
      # Windows ignores the Linux outputs and keeps matrix 4 / 4.
      CMAKE_BUILD_PARALLEL_LEVEL: ${{ (matrix.name == 'Linux GCC Debug' && needs.linux-runner.outputs.gcc_jobs) || (matrix.name == 'Linux Clang Release' && needs.linux-runner.outputs.clang_jobs) || matrix.jobs }}
      CTEST_PARALLEL_LEVEL: ${{ (matrix.name == 'Linux GCC Debug' && needs.linux-runner.outputs.gcc_tests) || (matrix.name == 'Linux Clang Release' && needs.linux-runner.outputs.clang_tests) || matrix.tests }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux `os` is the box label set a trusted pick may emit. pull_request runs-on
          # does not read it: the expression above forces ubuntu-latest for Linux rows.
          - { name: "Linux GCC Debug",       os: '["self-hosted","linux","isoforge"]', jobs: 4, tests: 2, preset: ci-linux-gcc,   build: ci-linux-gcc,        test: ci-linux-gcc,        ctest-args: "" }
          - { name: "Linux Clang Release",   os: '["self-hosted","linux","isoforge"]', jobs: 4, tests: 2, preset: ci-linux-clang, build: ci-linux-clang,      test: ci-linux-clang,      ctest-args: "-LE python_only" }
          - { name: "Windows MSVC Debug",    os: '"windows-latest"', jobs: 4, tests: 4, preset: ci-win-msvc,    build: ci-win-msvc-debug,   test: ci-win-msvc-debug,   ctest-args: "" }
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ${{ matrix.preset }}
          build: ${{ matrix.build }}
          test: ${{ matrix.test }}
          ctest-args: ${{ matrix.ctest-args }}

  windows-release:
    name: Windows MSVC Release
    needs: changes
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && needs.changes.outputs.code == 'true') ||
      (github.event_name == 'pull_request' && needs.changes.outputs.code == 'true' &&
       contains(github.event.pull_request.labels.*.name, 'ci-windows-release'))
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-win-msvc
          build: ci-win-msvc-release
          test: ci-win-msvc-release
          ctest-args: "-LE python_only"

  # Nightly gate: run the scheduled macOS job only if main moved since the last successful
  # scheduled run (compares head_sha via the Actions API). Dispatch always runs.
  nightly-gate:
    name: Nightly gate
    needs: [linux-runner]
    if: github.event_name == 'schedule'
    # Same box rule as build-test. schedule on main may use the picker's choice.
    # Any other event is ubuntu-latest even if nightly_runs_on names the box.
    runs-on: ${{ fromJSON((!(github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')) && '"ubuntu-latest"') || needs.linux-runner.outputs.nightly_runs_on || '"ubuntu-latest"') }}
    permissions:
      actions: read
      contents: read
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          last=$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=main&event=schedule&status=success&per_page=1" \
                   --jq '.workflow_runs[0].head_sha // ""' || echo "")
          echo "current=$SHA last-successful-nightly=${last:-none}"
          if [ "$last" = "$SHA" ]; then echo "run=false" >> "$GITHUB_OUTPUT"; else echo "run=true" >> "$GITHUB_OUTPUT"; fi

  macos:
    name: macOS AppleClang Debug
    needs: [changes, nightly-gate]
    if: >-
      always() && needs.changes.result == 'success' &&
      ((github.event_name == 'schedule' && needs.nightly-gate.outputs.run == 'true') ||
       github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' && needs.changes.outputs.mac == 'true'))
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/cmake-ci
        with:
          preset: ci-mac-clang
          build: ci-mac-clang
          test: ci-mac-clang

  # The one check to mark required. Skipped jobs (docs-only PR, macOS not needed, Windows Release
  # on an unlabelled PR, linux-runner when no Linux job is needed) count as OK; failed or
  # cancelled ones fail the gate. linux-runner skipped on a code push/PR or on schedule fails
  # the gate: that would also skip build-test / nightly-gate and look green.
  ci-required:
    name: ci-required
    needs: [changes, linux-runner, nightly-gate, build-test, windows-release, macos]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        env:
          RESULTS: ${{ needs.changes.result }} ${{ needs.linux-runner.result }} ${{ needs.nightly-gate.result }} ${{ needs.build-test.result }} ${{ needs.windows-release.result }} ${{ needs.macos.result }}
          # 'changes' may only be skipped on purpose for a draft PR.
          DRAFT: ${{ github.event_name == 'pull_request' && github.event.pull_request.draft }}
          CHANGES: ${{ needs.changes.result }}
          LINUX_RUNNER: ${{ needs.linux-runner.result }}
          EVENT: ${{ github.event_name }}
          CODE: ${{ needs.changes.outputs.code }}
        run: |
          if [ "$CHANGES" = skipped ] && [ "$DRAFT" != true ]; then
            echo "::error::changes skipped on a non-draft run"; exit 1
          fi
          if [ "$LINUX_RUNNER" = skipped ] && { [ "$EVENT" = schedule ] || { [ "$CODE" = true ] && { [ "$EVENT" = push ] || [ "$EVENT" = pull_request ]; }; }; }; then
            echo "::error::linux-runner skipped while a Linux job was required"; exit 1
          fi
          echo "changes linux-runner nightly-gate build-test windows-release macos: $RESULTS"
          for r in $RESULTS; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::a required job ended as '$r'"; exit 1 ;;
            esac
          done

  # Nightly macOS failure -> open or update one tracking issue (last green sha vs current sha).
  nightly-report:
    name: Report nightly macOS failure
    needs: macos
    if: always() && github.event_name == 'schedule' && needs.macos.result == 'failure'
    runs-on: ubuntu-latest
    permissions:
      issues: write
      actions: read
    steps:
      - name: Open or update the tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SERVER: ${{ github.server_url }}
        run: |
          set -euo pipefail
          title="Nightly macOS CI failing on main"
          # Last scheduled run of this workflow on main whose macOS job succeeded.
          last_green=""
          for id in $(gh run list --workflow ci.yml --branch main --event schedule --limit 30 \
                        --json databaseId,headSha -q '.[].databaseId'); do
            ok=$(gh run view "$id" --json jobs -q '[.jobs[] | select(.name == "macOS AppleClang Debug" and .conclusion == "success")] | length')
            if [ "$ok" != "0" ]; then last_green=$(gh run view "$id" --json headSha -q .headSha); break; fi
          done
          if [ -n "$last_green" ]; then
            compare="$SERVER/$GH_REPO/compare/$last_green...$SHA"
            range="Last green: \`$last_green\`. Current: \`$SHA\`. Compare: $compare"
          else
            range="Last green: none in the last 30 nightly runs. Current: \`$SHA\`."
          fi
          body=$(printf 'The nightly **macOS AppleClang Debug** job failed.\n\n%s\n\nRun: %s\n\n_Opened/updated by the nightly-report job in ci.yml._' "$range" "$RUN_URL")
          gh label create ci-nightly --color B60205 --description "Nightly CI failure" 2>/dev/null || true
          num=$(gh issue list --state open --label ci-nightly --search "in:title \"$title\"" --json number -q '.[0].number // empty')
          if [ -n "$num" ]; then
            gh issue comment "$num" --body "$body"
          else
            gh issue create --title "$title" --label ci-nightly --body "$body"
          fi
