name: Linux runner canary
# Dispatched by ci.yml (linux-runner) with ref = the default branch. Exists so that job can
# see whether the isoforge box accepts work. It must stay free of checkout, secrets, and
# pull_request / pull_request_target: a PR must not be able to run its own code here.
# The workflow file on the default branch is the one that runs, not the PR head.
run-name: linux-runner-canary ${{ inputs.cid }}

on:
  workflow_dispatch:
    inputs:
      cid:
        description: Correlation id from the ci.yml linux-runner job
        required: true
        type: string
      isolate:
        description: >-
          When true (CI_BURST), this probe uses its own concurrency group so other
          PRs are not cancelled. Omit or false for the shared one-at-a-time group.
        required: false
        default: "false"
        type: string

permissions: {}

concurrency:
  # Shared group (isolate not true): one canary at a time. A new probe cancels a canary
  # still queued on a paused box. That lock only exists to protect the single box.
  # CI_BURST passes isolate=true: one group per probe, and cancel-in-progress is off, so
  # several PRs' probes can be in flight. linux-runner then keeps at most one run on the box.
  group: ${{ inputs.isolate == 'true' && format('linux-runner-canary-{0}', inputs.cid) || 'linux-runner-canary' }}
  cancel-in-progress: ${{ inputs.isolate != 'true' }}

jobs:
  ping:
    name: Box accepted the job
    runs-on: [self-hosted, linux, isoforge]
    timeout-minutes: 2
    steps:
      - name: Runner is online
        run: echo "isoforge runner online"
