name: Linux runner canary
# Dispatched by ci.yml (linux-runner) with ref = the default branch, and only from a
# push to main, schedule, or workflow_dispatch on main. A pull_request run does not
# dispatch this. Exists so that job can see whether the isoforge box accepts work.
# It must stay free of checkout, secrets, and pull_request / pull_request_target:
# a PR must not be able to run its own code here. The workflow file on the ref that
# was dispatched is the one that runs. A fork pull_request cannot dispatch this:
# its GITHUB_TOKEN is read-only, and permissions below are empty. Pin this file in
# the runner group at @refs/heads/main (docs/CI_SELF_HOSTED.md). A workflow_dispatch
# of any other ref must not ask the box for a runner (see the job if).
run-name: linux-runner-canary ${{ inputs.cid }}

on:
  workflow_dispatch:
    inputs:
      cid:
        description: Correlation id from the ci.yml linux-runner job
        required: true
        type: string
      isolate:
        description: >-
          When true (CI_BURST), this probe uses its own concurrency group so other
          main-branch probes are not cancelled. Omit or false for the shared
          one-at-a-time group. pull_request runs do not dispatch this workflow.
        required: false
        default: "false"
        type: string

permissions: {}

concurrency:
  # Shared group (isolate not true): one canary at a time. A new probe cancels a canary
  # still queued on a paused box. That lock only exists to protect the single box.
  # CI_BURST passes isolate=true: one group per probe, and cancel-in-progress is off, so
  # several main-branch probes can be in flight. linux-runner then keeps at most one
  # run on the box. pull_request runs do not dispatch this workflow.
  group: ${{ inputs.isolate == 'true' && format('linux-runner-canary-{0}', inputs.cid) || 'linux-runner-canary' }}
  cancel-in-progress: ${{ inputs.isolate != 'true' }}

jobs:
  ping:
    name: Box accepted the job
    # Dispatch of any other ref skips the job, so no runner is requested.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, isoforge]
    timeout-minutes: 2
    steps:
      - name: Runner is online
        run: echo "isoforge runner online"
